version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: holicindo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: holicindo
      POSTGRES_PASSWORD: holic123
      POSTGRES_DB: holicindo_web
    ports:
      - "5433:5432"
    volumes:
      - holicindo_pgdata:/var/lib/postgresql/data

volumes:
  holicindo_pgdata:
